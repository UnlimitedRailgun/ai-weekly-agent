[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-weekly-agent"
version = "0.1.0"
description = "A beginner-friendly weekly AI and Computer Engineering research agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ai-weekly = "ai_weekly_agent.main:main"
ai-weekly-agent = "ai_weekly_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
